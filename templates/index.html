<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Simple URL Shortener</title>
  </head>
  <body>
    <h1>Simple URL Shortener</h1>
    <form id="shorten-form">
      <input type="text" id="url" placeholder="Enter URL" size="60" />
      <br /><br />
      <button type="submit">Shorten</button>
    </form>

    <br />
    <details>
      <summary>Options</summary>
      <div style="margin-top:10px">
        <label for="expiry">Expires:</label>
        <select id="expiry">
          <option value="">Never</option>
          <option value="1800">In 30 minutes</option>
          <option value="3600">In 1 hour</option>
          <option value="21600">In 6 hours</option>
          <option value="86400">In 1 day</option>
          <option value="604800">In 7 days</option>
          <option value="custom">Custom date & time</option>
        </select>
        <br /><br />
        <input type="datetime-local" id="expiry-custom" step="1" style="display:none" />
        <br id="custom-br" style="display:none" />
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="optional" size="30" />
      </div>
    </details>

    <p id="result"></p>
    <p id="expiry-info"></p>
    <p id="protect-info"></p>
    <button id="copy-btn" style="display:none" type="button">Copy</button>
    <span id="copy-msg"></span>
    <br />
    <img id="qr-img" src="" alt="QR code" style="display:none; margin-top:10px" />

    <script>
      const form = document.getElementById('shorten-form');
      const urlInput = document.getElementById('url');
      const expirySelect = document.getElementById('expiry');
      const customInput = document.getElementById('expiry-custom');
      const customBr = document.getElementById('custom-br');
      const passwordInput = document.getElementById('password');
      const result = document.getElementById('result');
      const expiryInfo = document.getElementById('expiry-info');
      const protectInfo = document.getElementById('protect-info');
      const copyBtn = document.getElementById('copy-btn');
      const copyMsg = document.getElementById('copy-msg');
      const qrImg = document.getElementById('qr-img');
      let shortUrl = '';

      const MAX_MS = 10 * 365 * 24 * 60 * 60 * 1000;

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function toLocalInput(date) {
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
      }

      expirySelect.addEventListener('change', function () {
        if (expirySelect.value === 'custom') {
          const now = Date.now();
          customInput.min = toLocalInput(new Date(now + 1000));
          customInput.max = toLocalInput(new Date(now + MAX_MS));
          customInput.style.display = 'inline';
          customBr.style.display = 'inline';
          customInput.focus();
        } else {
          customInput.style.display = 'none';
          customBr.style.display = 'none';
        }
      });

      copyBtn.addEventListener('click', async function () {
        if (!shortUrl) return;
        try {
          await navigator.clipboard.writeText(shortUrl);
          copyMsg.textContent = 'Copied!';
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = shortUrl;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyMsg.textContent = 'Copied!';
        }
        setTimeout(function () { copyMsg.textContent = ''; }, 1500);
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        copyMsg.textContent = '';
        const payload = {url: urlInput.value};
        if (expirySelect.value === 'custom') {
          if (!customInput.value) {
            result.textContent = 'Error: Please choose a date and time.';
            expiryInfo.textContent = '';
            protectInfo.textContent = '';
            copyBtn.style.display = 'none';
            qrImg.style.display = 'none';
            return;
          }
          const when = new Date(customInput.value);
          if (Number.isNaN(when.getTime()) || when.getTime() <= Date.now()) {
            result.textContent = 'Error: The expiration date must be in the future.';
            expiryInfo.textContent = '';
            protectInfo.textContent = '';
            copyBtn.style.display = 'none';
            qrImg.style.display = 'none';
            return;
          }
          payload.expires_at = Math.floor(when.getTime() / 1000);
        } else if (expirySelect.value) {
          payload.expires_in = Number(expirySelect.value);
        }
        if (passwordInput.value) {
          payload.password = passwordInput.value;
        }

        const res = await fetch('/shorten', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          shortUrl = data.short_url;
          result.textContent = 'Short URL: ' + data.short_url;
          if (data.expires_at) {
            expiryInfo.textContent = 'Expires: ' + data.expires_at.replace('+00:00', 'Z');
          } else {
            expiryInfo.textContent = 'Expires: never';
          }
          protectInfo.textContent = data.protected ? 'Password protected' : '';
          copyBtn.style.display = 'inline';
          qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(data.short_url);
          qrImg.style.display = 'block';
        } else {
          shortUrl = '';
          result.textContent = 'Error: ' + (data.error || JSON.stringify(data));
          expiryInfo.textContent = '';
          protectInfo.textContent = '';
          copyBtn.style.display = 'none';
          qrImg.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
